name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md instead.
        Remove credentials, private peer addresses, and sensitive transaction data before submitting.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `tronwatch version` or the commit hash.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, deployment method, and TRON network.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Start tronwatch with ...
        2. Observe ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Sanitized configuration
      description: Remove tokens, credentials, private endpoints, and sensitive watch addresses.
      render: json

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or metrics
      description: Include only the smallest relevant excerpt and remove sensitive values.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report does not contain credentials, private keys, or private data.
          required: true
        - label: This is not a security vulnerability.
          required: true
