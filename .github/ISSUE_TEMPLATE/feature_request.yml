name: Feature request
description: Propose a focused improvement
title: "feat: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational or user problem should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected inputs, outputs, and failure behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or different designs you evaluated.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note any configuration, event-schema, storage, or deployment changes.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
        - label: I can help test or implement this change.
          required: false
